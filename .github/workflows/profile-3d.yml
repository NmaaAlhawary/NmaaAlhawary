name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Strip opaque backgrounds
        run: |
          for f in profile-3d-contrib/*.svg; do
            sed -i 's|<rect x="0" y="0" width="1280" height="850" fill="#ffffff">|<rect x="0" y="0" width="1280" height="850" fill="none">|' "$f"
            sed -i 's|<rect x="0" y="0" width="1280" height="850" fill="#00000f">|<rect x="0" y="0" width="1280" height="850" fill="none">|' "$f"
          done

      - name: Commit generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution graph"
          git push
